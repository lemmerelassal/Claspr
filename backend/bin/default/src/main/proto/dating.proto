syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.dating.grpc";
option java_outer_classname = "DatingProto";

package dating;

// ── Authentication Service ─────────────────────────────
service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc ValidateToken (TokenRequest) returns (TokenValidationResponse);
}

// ── Profile Service ────────────────────────────────────
service ProfileService {
  rpc GetMyProfile (ProfileRequest) returns (ProfileResponse);
  rpc GetProfile (ProfileByIdRequest) returns (ProfileResponse);
  rpc UpdateProfile (UpdateProfileRequest) returns (ProfileResponse);
  rpc UpdateLocation (LocationUpdate) returns (ProfileResponse);
}

// ── Matching / Discovery Service ───────────────────────
service MatchingService {
  rpc GetPotentialMatches (MatchRequest) returns (MatchResponse);
  rpc RecordSwipe (SwipeRequest) returns (SwipeResponse);
  rpc GetMatches (GetMatchesRequest) returns (GetMatchesResponse);
  rpc UnmatchUser (UnmatchRequest) returns (UnmatchResponse);
}

// ── Chat Service ───────────────────────────────────────
service ChatService {
  rpc SendMessage (ChatMessageRequest) returns (ChatMessageResponse);
  rpc GetConversation (ConversationRequest) returns (ConversationResponse);
  rpc StreamMessages (ConversationRequest) returns (stream ChatMessage);
  rpc MarkRead (MarkReadRequest) returns (MarkReadResponse);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Auth Messages
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
message RegisterRequest {
  string email = 1;
  string password = 2;
  string display_name = 3;
  string date_of_birth = 4;
  Gender gender = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  string token = 1;
  string user_id = 2;
  string display_name = 3;
}

message TokenRequest {
  string token = 1;
}

message TokenValidationResponse {
  bool valid = 1;
  string user_id = 2;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Profile Messages
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
message ProfileRequest {
  string user_id = 1;
}

message ProfileByIdRequest {
  string user_id = 1;
  string target_user_id = 2;
}

message ProfileResponse {
  string user_id = 1;
  string display_name = 2;
  int32 age = 3;
  string bio = 4;
  Gender gender = 5;
  repeated string photo_urls = 6;
  repeated string interests = 7;
  string city = 8;
  double distance_km = 9;
  double latitude = 10;
  double longitude = 11;
  int32 max_distance_km = 12;
  int32 min_age_preference = 13;
  int32 max_age_preference = 14;
  Gender gender_preference = 15;
}

message UpdateProfileRequest {
  string user_id = 1;
  string display_name = 2;
  string bio = 3;
  Gender gender_preference = 4;
  double latitude = 5;
  double longitude = 6;
  string city = 7;
  int32 max_distance_km = 8;
  int32 min_age_preference = 9;
  int32 max_age_preference = 10;
  repeated string photo_urls = 11;
  repeated string interests = 12;
}

message LocationUpdate {
  string user_id = 1;
  double latitude = 2;
  double longitude = 3;
  string city = 4;
}

enum Gender {
  UNKNOWN = 0;
  MALE = 1;
  FEMALE = 2;
  NON_BINARY = 3;
  OTHER = 4;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Matching Messages
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
message MatchRequest {
  string user_id = 1;
  int32 limit = 2;
  double max_distance_km = 3;
  int32 min_age = 4;
  int32 max_age = 5;
}

message MatchResponse {
  repeated ProfileCard profiles = 1;
}

message ProfileCard {
  string user_id = 1;
  string display_name = 2;
  int32 age = 3;
  string bio = 4;
  repeated string photo_urls = 5;
  double distance_km = 6;
  repeated string interests = 7;
  string location_city = 8;
}

message SwipeRequest {
  string swiper_id = 1;
  string swiped_id = 2;
  SwipeDirection direction = 3;
}

enum SwipeDirection {
  LEFT = 0;
  RIGHT = 1;
  SUPER_LIKE = 2;
}

message SwipeResponse {
  bool is_match = 1;
  string match_id = 2;
  ProfileCard matched_profile = 3;
}

message GetMatchesRequest {
  string user_id = 1;
  int32 page = 2;
  int32 size = 3;
}

message GetMatchesResponse {
  repeated MatchEntry matches = 1;
  int32 total = 2;
}

message MatchEntry {
  string match_id = 1;
  ProfileCard profile = 2;
  string matched_at = 3;
  ChatMessage last_message = 4;
}

message UnmatchRequest {
  string user_id = 1;
  string match_id = 2;
}

message UnmatchResponse {
  bool success = 1;
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
// Chat Messages
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
message ChatMessageRequest {
  string match_id = 1;
  string sender_id = 2;
  string content = 3;
  MessageType type = 4;
}

enum MessageType {
  TEXT = 0;
  IMAGE = 1;
  GIF = 2;
}

message ChatMessageResponse {
  string message_id = 1;
  string sent_at = 2;
  bool delivered = 3;
}

message ConversationRequest {
  string match_id = 1;
  string user_id = 2;
  int32 page = 3;
  int32 size = 4;
}

message ConversationResponse {
  repeated ChatMessage messages = 1;
  int32 total = 2;
}

message ChatMessage {
  string message_id = 1;
  string sender_id = 2;
  string content = 3;
  MessageType type = 4;
  string sent_at = 5;
  bool read = 6;
}

message MarkReadRequest {
  string match_id = 1;
  string user_id = 2;
}

message MarkReadResponse {
  int32 marked_count = 1;
}
