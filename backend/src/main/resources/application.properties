# ── Application ──────────────────────────────────────────
quarkus.application.name=dating-app
quarkus.http.port=8080

# ── Datasource (PostgreSQL) ─────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST}:5432/${DB_NAME}
quarkus.datasource.jdbc.max-size=20

# ── Hibernate ORM ───────────────────────────────────────
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ── gRPC Server (PRIMARY TRANSPORT) ────────────────────
quarkus.grpc.server.port=9000
quarkus.grpc.server.use-separate-server=true
# Enable gRPC reflection for debugging with grpcurl/grpcui
quarkus.grpc.server.enable-reflection-service=true

# ── JWT (used by gRPC interceptor for auth metadata) ───
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://claspr.app
smallrye.jwt.sign.key.location=privateKey.pem
smallrye.jwt.new-token.lifespan=86400

# ── HTTP Security: permit all on transcoding proxy ──────
# Auth is handled at the app layer (user_id in request body),
# not at the HTTP/JWT layer for the transcoding proxy.
quarkus.http.auth.permission.public.paths=/grpc/*,/uploads/*,/api/*,/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.public.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS

# ── CORS (permissive for local dev) ─────────────────────
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-grpc-web,x-user-agent,grpc-timeout,origin
quarkus.http.cors.exposed-headers=grpc-status,grpc-message,grpc-encoding
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=86400

# ── Health (Kubernetes probes) ──────────────────────────
quarkus.smallrye-health.root-path=/q/health

# ── Metrics (Prometheus) ────────────────────────────────
quarkus.micrometer.export.prometheus.enabled=true

# ── Container Image ─────────────────────────────────────
quarkus.container-image.group=dating-app
quarkus.container-image.name=backend
quarkus.container-image.tag=${quarkus.application.version:latest}

# ── Logging ─────────────────────────────────────────────
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.dating".level=DEBUG

# ── App Config (SOLID: externalized magic values) ───────
app.default-max-distance-km=50
app.default-min-age=18
app.default-max-age=99
app.max-image-size-bytes=10485760
app.upload-directory=uploads/photos
app.allowed-image-types=image/jpeg,image/png,image/webp,image/gif
app.max-photos-per-user=6
